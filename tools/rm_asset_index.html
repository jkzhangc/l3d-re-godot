const CATS = ["全部", "火焰", "水冰", "光雷", "血伤", "武器", "角色", "其他"];
let cat = "全部", q = "";

const chips = document.getElementById("chips");
CATS.forEach(c => {
  const el = document.createElement("span");
  el.className = "chip" + (c === "全部" ? " on" : "");
  el.textContent = c;
  el.onclick = () => {
    cat = c;
    [...chips.children].forEach(x => x.classList.toggle("on", x.textContent === c));
    render();
  };
  chips.appendChild(el);
});

const tb = document.getElementById("tb");
const countEl = document.getElementById("count");
const emptyEl = document.getElementById("empty");
const toast = document.getElementById("toast");

function toastShow(msg) {
  toast.textContent = msg;
  toast.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => toast.classList.remove("show"), 1100);
}

function render() {
  const key = q.trim().toLowerCase();
  const frag = document.createDocumentFragment();
  let n = 0;
  for (const r of DATA) {
    if (cat !== "全部" && r.cat !== cat) continue;
    if (key) {
      const hay = (r.jp + " " + r.moji + " " + r.cat + " " + r.src + " " + r.ext).toLowerCase();
      if (!hay.includes(key)) continue;
    }
    n++;
    const tr = document.createElement("tr");
    tr.innerHTML =
      '<td class="' + (r.own ? 'own">已有' : 'no">—') + '</td>' +
      '<td class="jp">' + esc(r.jp) + '</td>' +
      '<td class="moji" title="点击复制">' + esc(r.moji) + '</td>' +
      '<td><span class="tag t-' + r.cat + '">' + r.cat + '</span></td>' +
      '<td class="src">' + r.src + '</td>' +
      '<td class="src">.' + r.ext + '</td>';
    tr.querySelector(".moji").onclick = (e) => {
      const txt = e.currentTarget.textContent;
      navigator.clipboard.writeText(txt).then(
        () => toastShow("已复制：" + txt),
        () => toastShow("复制失败，请手动选中")
      );
    };
    frag.appendChild(tr);
  }
  tb.replaceChildren(frag);
  emptyEl.style.display = n ? "none" : "block";
  const owned = DATA.filter(r => r.own).length;
  countEl.textContent = "显示 " + n + " / " + DATA.length + " 项 · 项目内已有 " + owned + " 项";
}

function esc(s) {
  return s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

document.getElementById("q").addEventListener("input", e => { q = e.target.value; render(); });
render();
</script>
